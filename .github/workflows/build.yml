name: build

# Każdy push i pull request: kompilacja wszystkich projektów (także Studio i renderera — tu działa NuGet)
# i testy Core. Błąd kompilacji w UI wychodzi tu, a nie dopiero u kogoś na komputerze.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: CPU
        shell: pwsh
        run: |
          if ($IsWindows) { (Get-CimInstance Win32_Processor).Name } else { (Select-String -Path /proc/cpuinfo -Pattern 'model name' | Select-Object -First 1).Line }
          Write-Output "::notice::$([System.Runtime.InteropServices.RuntimeInformation]::OSDescription) · AVX512F $([System.Runtime.Intrinsics.X86.Avx512F]::IsSupported) · FMA $([System.Runtime.Intrinsics.X86.Fma]::IsSupported)"
      - name: Build
        id: build
        run: dotnet build Animata.slnx -c Release
      - name: Test
        shell: pwsh
        run: ./.github/workflows/test.ps1 -Filter "Znane!=Bepu-beta29" -Level error
      # Znane porażki (Animata.Tests/KnownFailures.cs) — osobno, nie blokują; adnotacje jako ostrzeżenia.
      # Gdy wszystkie przejdą, krok to zgłasza: wtedy usunąć znacznik z testów.
      - name: Known failures (Bepu beta.29)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: ./.github/workflows/test.ps1 -Filter "Znane=Bepu-beta29" -Level warning -ReportPass
