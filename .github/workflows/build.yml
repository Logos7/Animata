name: build

# Każdy push i pull request: kompilacja wszystkich projektów (także Studio i renderera — tu działa NuGet)
# i testy Core. Błąd kompilacji w UI wychodzi tu, a nie dopiero u kogoś na komputerze.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Animata.slnx -c Release
      - name: Test
        run: dotnet test Animata.slnx -c Release --no-build --logger "console;verbosity=minimal"
